name: CD Pipeline

on:
  workflow_run:
    workflows: ["docker-image-build"]
    types:
      - completed

jobs:

  build:
    runs-on: self-hosted

    steps:
    - name: Pull Docker image
      run: sudo docker pull ssogden/nenv:latest
    - name: Delete Old docker container
      run: sudo docker rm -f nenv-container || true
    - name: Run Docker Container
      run: sudo docker run -d -p 8080:8080 --name nenv-container ssogden/nenv