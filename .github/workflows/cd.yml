name: CD Pipeline

on:
  workflow_run:
    workflows: ["docker-image-build"]
    types:
      - completed

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Pull Docker image
      run: docker pull ssogden/nenv:latest
    - name: Delete Old docker container
      run: docker rm -f nenv-container || true
    - name: Run Docker Container
      run: docker run -d -p 8090:8080 -e environment=dev --name nenv-container ssogden/nenv