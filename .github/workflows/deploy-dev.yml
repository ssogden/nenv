name: deploy-dev

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: self-hosted
    env:
      BLUE_IMAGE: ssogden/nenv:sha-a31b2c4
      GREEN_IMAGE: ssogden/nenv:sha-a31b2c4
      ACTIVE_POOL: blue
      RELEASE_ID_BLUE: foo
      RELEASE_ID_GREEN: bar
      PORT: 8080
      PROXY: 8000
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Run Docker Container
      run: docker compose down -v
    - name: create environment file
      run: |
        touch .env
        echo BLUE_IMAGE=${{ env.BLUE_IMAGE }} >> .env
        echo GREEN_IMAGE=${{ env.GREEN_IMAGE }} >> .env
        echo ACTIVE_POOL=${{ env.ACTIVE_POOL }} >> .env
        echo RELEASE_ID_BLUE=${{ env.RELEASE_ID_BLUE }} >> .env
        echo RELEASE_ID_GREEN=${{ env.RELEASE_ID_GREEN }} >> .env
        echo PORT=${{ env.PORT }} >> .env
    - name: Run Docker Container
      run: docker compose up -d --wait --wait-timeout 30
    - run: |
        ./scripts/wait-for-healthy-container.sh app_${{ env.ACTIVE_POOL }} 30