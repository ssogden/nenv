name: health-check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - deploy-dev
      - deploy-prod
    types:
      - completed
jobs:
  build:
    runs-on: self-hosted
    env:
      PROXY: 8000
    steps:
    - name: Health check 
      run: |
        curl -i http://localhost:${{ env.PROXY }}/healthz